  if(st['РУ12']&&st['SB7']){st['SB7']=false;push({t:'SB7off'});continue}
  var s=solve(st), chg=[];
  RELAYS.forEach(function(d){if(!!s.pw[d]!==!!st[d])chg.push(d)});
  if(chg.length){
    chg.forEach(function(d){st[d]=!!s.pw[d]; if(d==='РВ2'&&st[d])st['РВ2к']=true; if(d==='РВ3'&&!st[d])st['РВ3к']=false; if(d==='РВ5'&&!st[d])st['РВ5к']=false});
    push({t:'relay',ch:chg});continue;
  }
  if(st['Д1']&&st['РЭР']&&!st['РДМ']){st['РДМ']=true;push({t:'РДМ'});continue}
  if(st['РВ3']&&!st['РВ3к']){st['РВ3к']=true;push({t:'timer',d:'РВ3'});continue}
  if(!st['РВ2']&&st['РВ2к']){st['РВ2к']=false;push({t:'timer',d:'РВ2'});continue}
  if(st['РВ5']&&!st['РВ5к']){st['РВ5к']=true;push({t:'timer',d:'РВ5'});continue}
  break;
}
FR.forEach(function(fr){fr.s=solve(fr.st)});
window.__pk={FR:FR,EL:EL,solve:solve,SEG:SEG,f:f,Y:Y};

/* ================= Шаги: один шаг — одна новая цепь ================= */
var SIM=FR, STEPS=window.PK_STEPS||[];
function coilPath(s,dev){
  var L=s.live.filter(function(e){return e.dev===dev}); if(!L.length) return null;
  var adj={},E=[];
  function ae(a,b,o){var k=E.length;E.push({a:a,b:b,o:o});(adj[a]=adj[a]||[]).push(k);(adj[b]=adj[b]||[]).push(k)}
  SEG.forEach(function(g){if(s.P[g.net]&&g.net!==MIN)ae(key(g.a),key(g.b),g)});
  s.sw.forEach(function(e){if(!e.dup&&s.P[e.n1]&&s.P[e.n2])ae(key(e.p1),key(e.p2),e)});
  var deg={};Object.keys(adj).forEach(function(n){deg[n]=adj[n].length});
  PLUS.forEach(function(q){var k=key(q);deg[k]=(deg[k]||0)+1});
  L.forEach(function(e){[e.p1,e.p2].forEach(function(q){var k=key(q);if(s.P[f(k)])deg[k]=(deg[k]||0)+1})});
  var dead={},ch=true;
  while(ch){ch=false;Object.keys(deg).forEach(function(n){if(deg[n]<=1&&deg[n]!==-99){deg[n]=-99;ch=true;(adj[n]||[]).forEach(function(k){if(dead[k])return;dead[k]=1;var o=E[k].a===n?E[k].b:E[k].a;if(deg[o]!==-99)deg[o]--})}})}
  var segs=[],els=[];E.forEach(function(e,k){if(!dead[k]){if(e.o.el)segs.push(e.o);else els.push(e.o)}});
  /* направление тока: расстояние от «+» по живым участкам */
  var dist={},q=[];PLUS.forEach(function(p0){var k0=key(p0);if(deg[k0]===-99)return;dist[k0]=0;q.push(k0)});
  while(q.length){var n=q.shift();(adj[n]||[]).forEach(function(k){if(dead[k])return;var o=E[k].a===n?E[k].b:E[k].a;if(dist[o]===undefined){dist[o]=dist[n]+1;q.push(o)}})}
  var dir=new Map();E.forEach(function(e,k){if(dead[k]||!e.o.el)return;var da=dist[e.a],db=dist[e.b];dir.set(e.o,(da!==undefined&&db!==undefined&&db<da)?-1:1)});
  return {segs:segs,els:els,loads:L,dir:dir};
}
FR=STEPS.map(function(c){return {st:SIM[c.sim].st,s:SIM[c.sim].s,focus:c.focus||[],c:c}});
/* какие катушки уже «показаны» к каждому шагу */
function prep(FR,rev0){var rev=Object.assign({},rev0||{});FR.forEach(function(f){(f.revAdd||[]).forEach(function(d){rev[d]=1});f.focus.forEach(function(d){rev[d]=1});f.rev=Object.assign({},rev);
  var segs=new Set(),els=new Set(),loads=[],fs=new Set(),fl=[],fdir=new Map();
  Object.keys(rev).forEach(function(d){var pth=coilPath(f.s,d);if(!pth)return;pth.segs.forEach(function(g){segs.add(g)});pth.els.forEach(function(e){els.add(e)});loads=loads.concat(pth.loads);
    if(f.focus.indexOf(d)>=0){pth.segs.forEach(function(g){fs.add(g)});pth.dir.forEach(function(v,g){fdir.set(g,v)});fl=fl.concat(pth.loads)}});
  f.segs=segs;f.els=els;f.loads=loads;f.fsegs=fs;f.floads=fl;f.fdir=fdir;})}
prep(FR);
window.__pk.FR2=FR;
var PUSK=FR;

/* ===== Режим «Неисправность»: тот же расчёт тока, но с неисправным аппаратом и перемычкой ===== */
function runSim(st0,stopFn,hook){
  var st=clone(st0),out=[],g=0;
  function val(d,pw){return st['M_'+d]?true:(st['C_'+d]?false:!!pw[d])}
  while(g++<60){
    if(hook)hook(st);
    if(st['РУ12']&&st['SB7']){st['SB7']=false;out.push(clone(st));continue}
    var s=solve(st),chg=[];
    RELAYS.forEach(function(d){if(val(d,s.pw)!==!!st[d])chg.push(d)});
    if(chg.length){chg.forEach(function(d){st[d]=val(d,s.pw);if(d==='РВ2'&&st[d])st['РВ2к']=true;if(d==='РВ3'&&!st[d])st['РВ3к']=false;if(d==='РВ5'&&!st[d])st['РВ5к']=false});out.push(clone(st));continue}
    if(stopFn&&stopFn(st))break;
    if(st['Д1']&&st['РЭР']&&!st['РДМ']){st['РДМ']=true;out.push(clone(st));continue}
    if(st['РВ3']&&!st['РВ3к']){st['РВ3к']=true;out.push(clone(st));continue}
    if(!st['РВ2']&&st['РВ2к']){st['РВ2к']=false;out.push(clone(st));continue}
    if(st['РВ5']&&!st['РВ5к']){st['РВ5к']=true;out.push(clone(st));continue}
    break;
  }
  return st;
}
function onDevs(st){return RELAYS.filter(function(d){return st[d]})}
function upTo(sNow,stOk,target){ /* участок цепи от «+» до неисправного места: где напряжение есть, а тока нет */
  var s2=solve(stOk),set=new Set();
  target.forEach(function(d){var pth=coilPath(s2,d);if(pth)pth.segs.forEach(function(g){if(sNow.P[g.net]&&g.net!==MIN)set.add(g)})});
  return set;
}
var FAULTS={};
function buildFault(id,F){
  var FK=(F.coilFault?'C_':'F_')+F.bad; var init={'SA15р':true,'SB7':true}; init[FK]=true;
  var S1=runSim(init,F.stop);
  var s1=solve(S1);
  var okSt=clone(S1); delete okSt[FK]; if(F.ok)Object.keys(F.ok).forEach(function(k){okSt[k]=F.ok[k]});
  var A={st:S1,s:s1,focus:[],c:F.steps[0],bad:F.bad,revAdd:onDevs(S1).concat(F.coilFault&&s1.pw[F.bad]?[F.bad]:[]),orange:F.coilFault?new Set():upTo(s1,okSt,F.target)};
  var S2=clone(S1); if(F.jmp)S2.jmp=F.jmp; if(F.manual){S2['M_'+F.manual]=true;S2[F.manual]=true}
  var s2=solve(S2);
  var foc=F.target.filter(function(d){return s2.pw[d]});
  var B={st:S2,s:s2,focus:foc,c:F.steps[1],bad:F.bad,jnew:true};
  var S3=runSim(S2,null,F.release?function(st){if(st[F.release.when]&&st['M_'+F.manual]){delete st['M_'+F.manual]}}:null);
  var C={st:S3,s:solve(S3),focus:[],c:F.steps[2],bad:F.bad,revAdd:onDevs(S3)};
  var list=[A,B,C]; prep(list); FAULTS[id]={list:list,F:F};
}
(window.PK_FAULTS||[]).forEach(function(F){if(F.scheme)buildFault(F.id,F.scheme)});
var FMODE=null;

function segOn(f,g){
  if(g.net===MIN){ if(g.a[0]===BUS&&g.b[0]===BUS) return f.loads.length>0;
    return f.loads.some(function(e){return [e.p1,e.p2].some(function(q){return q[1]===g.a[1]&&g.a[1]===g.b[1]&&Math.min(g.a[0],g.b[0])>=q[0]-1})}); }
  return f.segs.has(g);
}
function segFocus(f,g){
  if(g.net===MIN){ if(g.a[0]===BUS&&g.b[0]===BUS) return false;
    return f.floads.some(function(e){return [e.p1,e.p2].some(function(q){return q[1]===g.a[1]&&g.a[1]===g.b[1]&&Math.min(g.a[0],g.b[0])>=q[0]-1})}); }
  return f.fsegs.has(g);
}

/* ================= Отрисовка шага ================= */
var cur=0, sel=null;
function draw(){
  var fr=FR[cur], prev=FR[cur-1];
  SEG.forEach(function(g){
    var c='pk-w'+(g.col==='k'?' pk-wk':g.col==='b'?' pk-wb':'');
    var A=g.a,B=g.b;
    if(fr.orange&&fr.orange.has(g)&&!segOn(fr,g)) c+=' pk-up';
    if(segOn(fr,g)){ c+=' pk-on'; if(segFocus(fr,g)&&!(prev&&segOn(prev,g))){ c+=' pk-new';
      var dv=fr.fdir.get(g); if(g.net===MIN) dv=(g.b[0]>=g.a[0])?1:-1; if(dv===-1){A=g.b;B=g.a} } }
    g.el.setAttribute('x1',A[0]);g.el.setAttribute('y1',A[1]);g.el.setAttribute('x2',B[0]);g.el.setAttribute('y2',B[1]);
    g.el.setAttribute('class',c);
  });
  EL.forEach(function(e){
    var cls='pk-el';
    if(e.jumper){ var on=closed(e,fr.st); e.g.setAttribute('class','pk-el pk-jg'+(on?' on':'')+(on&&fr.jnew?' new':'')); return; }
    if(e.kind==='sw'){
      var cl=closed(e,fr.st), was=prev?closed(e,prev.st):cl;
      if(e.bl){ if(e.tum){var yy=+e.bl.getAttribute('y1');e.bl.setAttribute('x2',cl?160:156);e.bl.setAttribute('y2',cl?yy:yy-10)}
                else{e.bl.setAttribute('x2',cl?13:11);e.bl.setAttribute('y2',cl?0:-11)} }
      if(cl!==was) cls+=' pk-chg';
      if(cl&&(fr.els.has(e)||(e.dup&&fr.els.has(e.dup)))) cls+=' pk-con';
    } else if(e.kind==='coil'){
      if(fr.st[e.dev]) cls+=' pk-act';
      var shown=fr.loads.indexOf(e)>=0;
      if(shown) cls+=' pk-pow';
      if(fr.focus.indexOf(e.dev)>=0) cls+=' pk-pnew';
      if(prev&&!!prev.st[e.dev]!==!!fr.st[e.dev]) cls+=' pk-chg';
    } else return;
    if(fr.bad&&e.dev===fr.bad) cls+=' pk-bad';
    if(sel) cls+=(e.dev===sel?' pk-sel':' pk-dim');
    e.g.setAttribute('class',cls);
  });
  var c=fr.c||{};
  document.getElementById('pk_tag').textContent=(FMODE?'Неисправность · ':'')+'Шаг '+(cur+1)+' из '+FR.length+(c.tag?' · '+c.tag:'');
  document.getElementById('pk_title').innerHTML=c.title||'';
  document.getElementById('pk_desc').innerHTML='<p class="pk-txt">'+(c.text||'')+'</p>'+(c.chain?'<div class="pk-chain"><span class="pk-cl">Цепь:</span> '+c.chain+'</div>':'');
  document.getElementById('pk_plabel').textContent='Шаг '+(cur+1)+' из '+FR.length;
  document.getElementById('pk_pfill').style.width=((cur+1)/FR.length*100)+'%';
  document.getElementById('pk_prev').disabled=cur===0;
  document.getElementById('pk_next').disabled=cur===FR.length-1;
  document.getElementById('pk_ft').innerHTML='<b>'+(cur+1)+'/'+FR.length+'</b> '+(c.title||'');
  document.getElementById('pk_fp').disabled=cur===0; document.getElementById('pk_fn').disabled=cur===FR.length-1;
}
function go(i){cur=Math.max(0,Math.min(FR.length-1,i));draw()}
document.getElementById('pk_prev').onclick=function(){go(cur-1)};
document.getElementById('pk_next').onclick=function(){go(cur+1)};
document.getElementById('pk_prog').onclick=function(ev){var r=this.getBoundingClientRect();go(Math.floor((ev.clientX-r.left)/r.width*FR.length))};

/* выбор аппарата */
var info=document.getElementById('pk_info');
var INFO=window.PK_INFO||{};
function pick(d){
  sel=(sel===d)?null:d; draw();
  if(!sel){info.hidden=true;return}
  var items=EL.filter(function(e){return e.dev===sel&&e.kind!=='load'});
  var hasCoil=items.some(function(e){return e.kind==='coil'});
  var no=items.filter(function(e){return e.kind==='sw'&&e.s!=='NC'}).length, nc=items.filter(function(e){return e.kind==='sw'&&e.s==='NC'}).length;
  var ex=items.map(function(e){return e.info}).filter(Boolean)[0]||'';
  var parts=[];if(hasCoil)parts.push('катушка');if(no)parts.push('замыкающих контактов: '+no);if(nc)parts.push('размыкающих контактов: '+nc);
  var st=FR[cur].st, on=st[sel];
  var stTxt=hasCoil?(on?' Сейчас включено.':' Сейчас выключено.'):'';
  info.innerHTML='<b>'+sel+'</b>'+(INFO[sel]?' — '+INFO[sel]:'')+(ex&&!INFO[sel]?' — '+ex:'')+'<div class="ch">На схеме: '+(parts.join(', ')||'—')+'.'+stTxt+'</div>';
  info.hidden=false;
}
EL.forEach(function(e){if(e.g&&!e.g.__pk){e.g.__pk=1;e.g.addEventListener('click',function(ev){ev.stopPropagation();pick(e.dev)})}});
sv.addEventListener('click',function(){if(sel)pick(sel)});

/* масштаб */
var sheet=document.getElementById('pk_sheet'), z=null;
function apply(){sv.setAttribute('width',Math.round(W*z));sv.setAttribute('height',Math.round(H*z))}
function fit(){var w=sheet.clientWidth||700;z=Math.max(0.3,(w-2)/W);if(w<700)z=Math.max(z,0.85);apply()}
function zin(){var c=sheet.scrollLeft+sheet.clientWidth/2, r=c/(W*z); z=Math.min(3,z*1.25);apply();sheet.scrollLeft=r*W*z-sheet.clientWidth/2}
function zout(){var c=sheet.scrollLeft+sheet.clientWidth/2, r=c/(W*z); z=Math.max(0.3,z/1.25);apply();sheet.scrollLeft=r*W*z-sheet.clientWidth/2}
var full=false;
function setFull(f){full=f;root.classList.toggle('pk-isfull',f);document.documentElement.classList.toggle('pk-noscroll',f);fit()}
document.getElementById('pk_full').onclick=function(){setFull(true)};
document.getElementById('pk_fx').onclick=function(){setFull(false)};
document.getElementById('pk_fp').onclick=function(){go(cur-1)};
document.getElementById('pk_fn').onclick=function(){go(cur+1)};
document.getElementById('pk_fi').onclick=zin; document.getElementById('pk_fo').onclick=zout;
document.addEventListener('keydown',function(e){if(full&&e.key==='Escape')setFull(false)});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(!root.hidden)fit()},150)});
document.getElementById('pk_zi').onclick=zin;
document.getElementById('pk_zo').onclick=zout;
document.getElementById('pk_zf').onclick=fit;
window.__pkShow=function(){ if(z===null) fit(); };
function showBad(){
  if(!FMODE) return; var fr=FR[cur]; var e=EL.find(function(x){return x.dev===fr.bad&&x.p1});
  var foc=(fr.floads&&fr.floads[0])||e; if(!foc||z===null) return;
  var y=foc.p1[1]*z, x=foc.p1[0]*z;
  sheet.scrollTop=Math.max(0,y-sheet.clientHeight*0.6); sheet.scrollLeft=Math.max(0,x-sheet.clientWidth*0.6);
}
function setMode(id){
  FMODE=id||null; FR=id?FAULTS[id].list:PUSK; sel=null; info.hidden=true;
  var ban=document.getElementById('pk_fban'); ban.hidden=!id;
  if(id) document.getElementById('pk_fname').textContent=FAULTS[id].F.title;
  go(0); setTimeout(showBad,40);
}
window.__pkFault=function(id){ if(!FAULTS[id])return; setMode(id); window.scrollTo(0,0) };
var _go0=go; go=function(i){_go0(i); if(FMODE) setTimeout(showBad,20)};
window.__pkPusk=function(){ if(FMODE) setMode(null) };
var tbP=document.querySelector('.tb[data-t="p"]'); if(tbP) tbP.addEventListener('click',function(){window.__pkPusk()});
document.getElementById('pk_fback').onclick=function(){ if(typeof showTab==='function')showTab('f'); setMode(null); window.scrollTo(0,0) };
document.getElementById('pk_fpusk').onclick=function(){ setMode(null) };

go(0);
})();
/* ===== Раздел «Неисправности»: список карточек ===== */
(function(){
var root=document.getElementById('vf'); if(!root) return;
var F=window.PK_FAULTS||[];
var groups=[];F.forEach(function(f){if(groups.indexOf(f.grp)<0)groups.push(f.grp)});
var h='<p class="fl-intro">Признак, что проверить, куда ставить перемычку. Где есть кнопка «Показать на схеме», на принципиальной схеме видно, куда доходит ток при неисправности и как он идёт в обход через перемычку.</p>';
groups.forEach(function(g){
  h+='<h2 class="fl-g">'+g+'</h2>';
  F.filter(function(f){return f.grp===g}).forEach(function(f){
    h+='<details class="fl" id="fl_'+f.id+'"><summary><span class="fl-t">'+f.title+'</span>'+(f.scheme?'<span class="fl-tag">схема</span>':'')+(f.photos?'<span class="fl-tag">фото</span>':'')+'</summary><div class="fl-b">';
    if(f.sign) h+='<div class="fl-row"><div class="fl-l">Признак</div><div>'+f.sign+'</div></div>';

    if(f.jumper) h+='<div class="fl-j"><b>Перемычка.</b> '+f.jumper+'</div>';
    if(f.warn) h+='<div class="fl-w"><b>Внимание!</b> '+f.warn+'</div>';
    if(f.scheme) h+='<button type="button" class="btnp fl-show" data-id="'+f.id+'">Показать на схеме →</button>';
    if(f.photos) h+='<div class="fl-ph">'+f.photos.map(function(p){return '<figure><button type="button" class="fl-img" data-src="img/'+p[0]+'" data-cap="'+p[1]+'"><img loading="lazy" src="img/'+p[0]+'" alt="'+p[1]+'"></button><figcaption>'+p[1]+'</figcaption></figure>'}).join('')+'</div>';
    h+='<div class="fl-src">Источник: '+f.src+'</div></div></details>';
  });
});
h+='<div class="fl-lb" id="fl_lb" hidden><button type="button" class="fl-x" aria-label="Закрыть">✕</button><img id="fl_lbi" alt=""><div id="fl_lbc"></div></div>';
root.innerHTML=h;
root.addEventListener('click',function(e){
  var b=e.target.closest('.fl-show');
  if(b){ if(typeof showTab==='function')showTab('p'); if(window.__pkFault)window.__pkFault(b.getAttribute('data-id')); return }
  var im=e.target.closest('.fl-img');
  if(im){ var lb=document.getElementById('fl_lb'); document.getElementById('fl_lbi').src=im.getAttribute('data-src'); document.getElementById('fl_lbc').textContent=im.getAttribute('data-cap'); lb.hidden=false; return }
  if(e.target.closest('.fl-lb')){ document.getElementById('fl_lb').hidden=true }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var lb=document.getElementById('fl_lb');if(lb&&!lb.hidden)lb.hidden=true}});
})();
