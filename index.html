<!DOCTYPE html>
<html lang="ru">
<head>

<title>Пуск дизеля ТЭМ18ДМ: схема по шагам</title>
<style>
:root{color-scheme:light dark;--page:#faf9f6;--surface-1:#f3f1ec;--surface-2:#ffffff;--border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.3);--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#8a887f;--bg-success:#eaf3de;--border-success:#97c459;--text-success:#27500a;--bg-accent:#e6f1fb;--border-accent:#85b7eb;--text-accent:#0c447c;--font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--radius:8px}
@media (prefers-color-scheme:dark){:root{--page:#1f1e1d;--surface-1:#2a2927;--surface-2:#30302e;--border:rgba(255,255,255,.14);--border-strong:rgba(255,255,255,.35);--text-primary:#f0eee6;--text-secondary:#b5b3aa;--text-muted:#8a887f;--bg-success:#27500a;--border-success:#639922;--text-success:#c0dd97;--bg-accent:#0c447c;--border-accent:#378add;--text-accent:#b5d4f4}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text-primary);font-family:var(--font-sans);font-size:16px;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;font-weight:500;margin:0 0 4px}
p.sub{margin:0 0 16px;font-size:14px;color:var(--text-secondary)}
button{font:inherit;font-size:14px;color:var(--text-primary);background:transparent;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:7px 14px;cursor:pointer}
button:hover{background:var(--surface-1)}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--text-accent);outline-offset:2px}
.sv text{font-family:var(--font-sans);font-size:11px}
.wo{stroke:var(--border-strong);stroke-width:1}
.wn{stroke:#1D9E75;stroke-width:2}
.wa{stroke:#378ADD;stroke-width:2.5}
.fl{stroke-dasharray:7 5}
@media (prefers-reduced-motion:no-preference){.fl{animation:fd .7s linear infinite}}
@keyframes fd{to{stroke-dashoffset:-12}}
.tw{fill:var(--text-secondary)}
.sv rect{stroke-width:.5}
.b0{fill:var(--surface-1);stroke:var(--border-strong);stroke-dasharray:3 2}
.b1{fill:var(--bg-success);stroke:var(--border-success)}
.bk{fill:var(--surface-1);stroke:var(--border)}
.sv rect.bc{stroke:#378ADD;stroke-width:1.5;stroke-dasharray:none}
.t0{fill:var(--text-muted)}.t1{fill:var(--text-success)}.tk{fill:var(--text-secondary)}
.c0{fill:var(--surface-1);stroke:var(--border-strong)}
.c1{fill:var(--bg-success);stroke:var(--border-success)}
.sv rect.cn{fill:var(--bg-accent);stroke:var(--border-accent);stroke-width:1.5}
.cg{fill:none;stroke:var(--border-strong);stroke-dasharray:3 2}
.u0{fill:var(--text-secondary)}.u1{fill:var(--text-success)}.un{fill:var(--text-accent)}.ug{fill:var(--text-muted)}
.cb{font-weight:500}
.bl{transition:transform .45s ease}
@media (prefers-reduced-motion:reduce){.bl{transition:none}}
.hl{fill:var(--bg-accent);stroke:var(--border-accent);stroke-width:1}
.tl{fill:var(--text-secondary)}
.wp{stroke:#EF9F27;stroke-width:2}
.sv rect.hp{fill:none;stroke:#EF9F27;stroke-width:1.5;stroke-dasharray:4 3}
.tp{fill:var(--text-primary);font-weight:500}
.hot{cursor:pointer}
.tabs{display:flex;gap:8px;margin:8px 0 14px}
.tb.on{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent);font-weight:500}
.sw{display:inline-block;width:12px;height:12px;border:1px solid;border-radius:3px;margin-right:6px;vertical-align:-2px}
.ksv text{font-family:var(--font-sans)}
.ksv .th{font-size:14px;font-weight:500}
.ksv .ts{font-size:12px}
.kb{cursor:pointer}
.kb:focus{outline:none}
.kg rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.kg .th{fill:#444441}.kg .ts{fill:#5F5E5A}
.kp rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.kp .th{fill:#3C3489}.kp .ts{fill:#534AB7}
.kt rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.kt .th{fill:#085041}.kt .ts{fill:#0F6E56}
@media (prefers-color-scheme:dark){.kg rect{fill:#444441;stroke:#B4B2A9}.kg .th{fill:#D3D1C7}.kg .ts{fill:#B4B2A9}.kp rect{fill:#3C3489;stroke:#AFA9EC}.kp .th{fill:#CECBF6}.kp .ts{fill:#AFA9EC}.kt rect{fill:#085041;stroke:#5DCAA5}.kt .th{fill:#9FE1CB}.kt .ts{fill:#5DCAA5}}
.kb.ks rect{stroke:var(--text-primary);stroke-width:2.5}
.ar{fill:none;stroke:var(--text-secondary);stroke-width:1.5}
.kl{fill:var(--text-secondary);font-size:12px}
.notes{margin-top:28px;padding-top:16px;border-top:0.5px solid var(--border)}
.top{padding:4px 0 6px;margin:0 0 10px}
.top .card{margin:0 0 8px}
.top .bar{margin:0;flex:none}
.bar{margin:0 0 16px}
.hot:focus{outline:none}
.sv rect.sl{fill:none;stroke:var(--text-primary);stroke-width:2.5}
[hidden]{display:none!important}
.info{position:sticky;bottom:12px;background:var(--surface-2);border:1.5px solid var(--text-primary);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:13px;line-height:1.55;z-index:5}
.pr{color:#BA7517}
.ch{font-size:12px;color:var(--text-secondary);margin:3px 0 0;line-height:1.55;word-break:break-word}
.card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin:10px 0 12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:0 0 6px}
.legend i{display:inline-block;width:14px;height:0;margin-right:5px;vertical-align:3px}
.bar{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
.dots b{width:8px;height:8px;border-radius:50%;background:var(--border-strong);display:block;cursor:pointer}
.dots b.cur{background:var(--text-accent);transform:scale(1.35)}
.dots b.done{background:var(--text-success)}

:root{--fs:14px}
body{font-size:var(--fs)}
main{max-width:720px}
h1{font-size:24px;margin:0 0 6px}
.tabs{display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--border);margin:8px 0 18px}
.tabs .tb{border:none;border-bottom:3px solid transparent;border-radius:0;padding:10px 18px;font-size:calc(var(--fs) + 1px);color:var(--text-secondary);margin-bottom:-1px;background:transparent}
.tabs .tb:hover{background:transparent;color:var(--text-primary)}
.tabs .tb.on{background:transparent;border-bottom-color:#185FA5;color:var(--text-accent);font-weight:500}
button{font-size:var(--fs)}
.card{padding:1.1rem 1.4rem}
.stt{font-size:calc(var(--fs) + 3px);font-weight:500}
.stm{font-size:calc(var(--fs) - 3px);color:var(--text-secondary);white-space:nowrap}
.cause{font-size:calc(var(--fs) - 2px);color:var(--text-secondary);margin:2px 0 12px}
.desc{font-size:var(--fs);line-height:1.65}
.ch{font-size:calc(var(--fs) - 2px)}
.info{font-size:var(--fs)}
.legend{font-size:calc(var(--fs) - 2px);gap:8px 18px;margin:0 0 10px}
.btnp{background:#185FA5;color:#fff;border:none;font-weight:500;padding:10px 24px}
.btnp:hover{background:#0C447C}
.bar{gap:14px}
.bar button:not(.btnp){padding:10px 18px}
.bar button:disabled{opacity:.4;cursor:default}
.prog{flex:1;cursor:pointer}
.plabel{text-align:center;font-size:calc(var(--fs) - 1px);color:var(--text-secondary);margin:0 0 5px}
.ptrack{height:9px;background:var(--surface-1);border:0.5px solid var(--border);border-radius:5px;overflow:hidden}
.pfill{height:100%;background:#378ADD;width:0;transition:width .25s}
.gh{font-size:13px;font-weight:500;fill:var(--text-primary)}
.gl{stroke:var(--border);stroke-width:1}
.kb{transition:opacity .3s}
.card{border-left:4px solid #378ADD}
.tag{font-size:calc(var(--fs) - 2px);color:var(--text-secondary);margin:0 0 6px}
.hd{font-size:calc(var(--fs) + 4px);font-weight:500;margin:0 0 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row{display:grid;grid-template-columns:92px 1fr;gap:10px;margin:0 0 8px;line-height:1.55}
.row .l{color:var(--text-secondary);font-size:calc(var(--fs) - 1px);padding-top:1px}
.pl{display:inline-block;padding:0 8px;border-radius:6px;font-weight:500;font-size:calc(var(--fs) - 1px);border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);margin:0 1px}
.wf{stroke:#7F77DD;stroke-width:2.5;stroke-dasharray:1 6;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){.wf{animation:fd2 .7s linear infinite}}
@keyframes fd2{to{stroke-dashoffset:-7}}
.sv rect.cf{fill:var(--surface-1);stroke:#7F77DD;stroke-width:1.5;stroke-dasharray:4 3}
.scx{width:100%}
.shint{display:none;font-size:12px;color:var(--text-secondary);text-align:center;margin:4px 0 0}
@media (max-width:640px){
:root{--fs:15px}
main{padding:10px 10px 28px}
h1{font-size:20px}
.tabs{overflow-x:auto;flex-wrap:nowrap;margin:6px 0 12px;-webkit-overflow-scrolling:touch}
.tabs .tb{padding:9px 12px;white-space:nowrap;font-size:var(--fs)}
.card{padding:.8rem .9rem}
.row{grid-template-columns:1fr;gap:2px;margin:0 0 10px}
.hd{font-size:calc(var(--fs) + 2px)}
.bar{flex-wrap:wrap;gap:8px}
.bar .prog{order:-1;flex:1 1 100%}
.bar button{flex:1 1 0;padding:12px 10px}
.legend{gap:6px 12px;font-size:12px}
.scx{overflow-x:auto;-webkit-overflow-scrolling:touch;border:0.5px solid var(--border);border-radius:10px}
.scx svg{min-width:640px;display:block}
.sv text{font-size:12px}
.sv .gh{font-size:14px}
.ksv .th{font-size:15px}
.ksv .ts{font-size:12.5px}
.shint{display:block}
.info{max-height:38vh;overflow:auto;font-size:14px;bottom:8px}
}
</style>
</head>
<body>
<main>
<h1>Пуск дизеля ТЭМ18ДМ</h1>
<div class="tabs"><button class="tb on" data-t="d">Схема</button><button class="tb" data-t="k">Последовательность</button></div>

</div>
</div>
<div class="legend">

<span><i style="border-top:2px solid #1D9E75"></i>ток есть</span>
<span><i style="border-top:1px solid var(--border-strong)"></i>тока нет</span>
<span><svg width="30" height="16" viewBox="0 0 30 16" style="vertical-align:-3px"><circle cx="4" cy="12" r="2" fill="currentColor"/><circle cx="26" cy="12" r="2" fill="currentColor"/><line x1="4" y1="12" x2="26" y2="2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> контакт разомкнут</span><span><svg width="30" height="16" viewBox="0 0 30 16" style="vertical-align:-3px"><circle cx="4" cy="12" r="2" fill="currentColor"/><circle cx="26" cy="12" r="2" fill="currentColor"/><line x1="4" y1="12" x2="26" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> замкнут</span><span><i style="border-top:2px solid #EF9F27"></i>цепь подготовлена на этом шаге: напряжение дошло до разомкнутого контакта (он в оранжевой рамке)</span><span><svg width="38" height="24" viewBox="0 0 38 24" style="vertical-align:-7px"><rect x="1" y="1" width="36" height="22" rx="6" fill="var(--bg-accent)" stroke="#378ADD" stroke-width="1.5"/><circle cx="9" cy="13" r="2.2" fill="currentColor"/><circle cx="29" cy="13" r="2.2" fill="currentColor"/><line x1="9" y1="13" x2="29" y2="13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg> контакт переключился на этом шаге</span>
</div>
<div class="scx"><svg class="sv" id="sv" width="100%" viewBox="0 0 680 770" role="img"><title>Схема пуска дизеля</title><desc>Релейная схема: плюс слева, минус справа, в каждой строке контакты и катушка.</desc></svg></div>

</div>

<div id="kinfo" class="info"></div>
</div>
</main>
<script>
var T=function(){return true};
function A(l,f){return [l,f]}
function K(l,t){return [l,T,1,t]}
function S1(n){return function(s){return s[n]}}
function N1(n){return function(s){return !s[n]}}
var R=[
{d:'КБУ',grp:'Питание цепей управления',e:[K('SF1, SB13')]},
{d:'РУ12',grp:'1. Запуск и топливо',src:S1('КБУ'),e:[A('Пуск',S1('btn')),K('Стоп'),K('РУ22'),K('ПЧТ')],by:{a:0,b:0,alts:[[{l:'РУ12',f:S1('РУ12')}]]}},
{d:'КТН',e:[A('РУ12',S1('РУ12')),K('РУ16'),A('РУ12',S1('РУ12'))]},
{d:'РУ7',e:[K('SA15','размыкающий, замкнут, пока тумблер выключен'),A('КТН',S1('КТН')),A('РУ4',N1('РУ4')),K('Ш2')]},
{d:'РВ2',grp:'2. Прокачка масла',e:[A('РУ12',S1('РУ12')),A('РУ7',S1('РУ7'))]},
{d:'РУ28',e:[K('SA15','размыкающий, замкнут, пока тумблер выключен'),A('КТН',S1('КТН')),A('КУ17',N1('КУ17')),A('РВ2',S1('РВ2к'))]},
{d:'РВ3',e:[A('КТН',S1('КТН')),A('КУ17',N1('КУ17')),A('РУ28',S1('РУ28'))]},
{d:'КМН',e:[A('КТН',S1('КТН')),A('РУ4',N1('РУ4')),A('РУ28',S1('РУ28'))]},
{d:'РУ29',e:[A('КТН',S1('КТН')),A('КУ17',N1('КУ17')),A('РВ2',S1('РВ2к')),A('РВ3',S1('РВ3к'))]},
{d:'РУ5',grp:'3. Проворот и подача топлива',e:[A('КТН',S1('КТН')),A('РУ29',S1('РУ29'))]},
{d:'РВ5',e:[A('КТН',S1('КТН')),A('РУ5',S1('РУ5'))]},
{d:'РУ30',e:[A('КТН',S1('КТН')),A('РВ5',S1('РВ5к'))]},
{d:'Д1',e:[A('РУ5',S1('РУ5')),K('КВ'),K('БУК'),K('ВПУ')]},
{d:'РЭР',e:[A('РУ12',S1('РУ12')),A('Д1',S1('Д1'))],by:{a:1,b:1,alts:[[{l:'РУ4',f:S1('РУ4')},{l:'РДМ',f:S1('РДМ')}]]}},
{d:'РУ4',grp:'4. Дизель запустился',e:[A('РУ12',S1('РУ12')),A('Д1',S1('Д1')),A('РДМ',S1('РДМ'))],by:{a:1,b:2,alts:[[{l:'РУ4',f:S1('РУ4')}],[{l:'РУ30',f:S1('РУ30')}]]}},
{d:'КУ17',e:[A('РУ12',S1('РУ12')),A('РУ4',S1('РУ4')),A('РДМ',S1('РДМ')),A('Д1',N1('Д1'))]},
{d:'КМ1',e:[A('КУ17',S1('КУ17')),K('SF3','замкнут, пока автомат включён'),K('SA1'),K('РПН')]},
{d:'ТН',pow:1,grp:'Силовые цепи: насосы и генератор',e:[K('SF2','замкнут, пока автомат включён'),K('ПТН 16 А'),A('КТН',S1('КТН'))]},
{d:'МН',pow:1,e:[K('ПМН 80 А'),A('КМН',S1('КМН'))]},
{d:'Г',pow:1,lab:'Генератор',e:[A('Д1',S1('Д1'))]}
];
var INFO={
'КБУ':{t:'КБУ — контактор блокировки управления',d:'подаёт питание 75 В на цепи управления после включения ключа «Блокировка управления» на пульте.'},
'РУ12':{t:'РУ12 — реле запуска дизеля',d:'включается кнопкой «Пуск дизеля», ставит себя на самопитание и остаётся включённым, пока работает дизель. Отключается кнопкой «Стоп».'},
'КТН':{t:'КТН — контактор топливного насоса',d:'подаёт питание на двигатель топливоподкачивающего насоса, а блок-контактами подготавливает цепи реле запуска (РВ3, РВ5, РУ5, РУ28, РУ29) и контактора КМН.'},
'РУ7':{t:'РУ7 — промежуточное реле запуска',d:'подаёт питание на реле времени РВ2 при запуске дизеля.'},
'РВ2':{t:'РВ2 — реле времени, 6±1 с',d:'нужно для устойчивого пуска: после появления давления масла держит пусковую цепь ещё около 6 секунд, и только потом она отключается.'},
'РУ28':{t:'РУ28 — промежуточное реле запуска',d:'подаёт питание на реле времени РВ3 (прокачка масла) и на контактор КМН масляного насоса.'},
'РВ3':{t:'РВ3 — реле времени предпусковой прокачки, 40+5 с',d:'пока идёт отсчёт, насос прокачивает масло; по окончании выдержки подаёт питание на РУ29 и разрешает проворот дизеля.'},
'КМН':{t:'КМН — контактор масляного насоса',d:'подаёт питание на двигатель маслопрокачивающего насоса перед пуском. При работающем дизеле его включение блокирует контакт КУ17.'},
'РУ29':{t:'РУ29 — промежуточное реле запуска',d:'после окончания прокачки масла подаёт питание на РУ5.'},
'РУ5':{t:'РУ5 — реле проворота',d:'подаёт питание на катушку пускового контактора Д1 и на реле времени РВ5.'},
'РВ5':{t:'РВ5 — реле времени, 16±2 с',d:'ограничивает время проворота дизеля: если давления масла нет, через 16 секунд подаёт питание на РУ30, и схема пуска разбирается.'},
'Д1':{t:'Д1 — пусковой контактор',d:'подключает тяговый генератор к батарее: тяговый генератор работает в режиме электродвигателя и проворачивает дизель. После пуска отключается.'},
'РЭР':{t:'РЭР — реле электронного регулятора дизеля',d:'подаёт на блок ЭСУВТ сигнал «пуск/стоп». Пока оно включено, подаётся топливо; если оно отключится, дизель остановится.'},
'РУ4':{t:'РУ4 — реле контроля давления масла при пуске',d:'получает питание через РДМ, встаёт на самопитание, размыкающими контактами снимает питание с РУ7 и КМН и разбирает схему пуска.'},
'КУ17':{t:'КУ17 — контактор управления',d:'признак того, что дизель запущен. Подаёт питание на КМ1 (возбуждение возбудителя) и не даёт включить КМН.'},
